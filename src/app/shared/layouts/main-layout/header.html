<header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6">
  <div class="flex items-center gap-3">
    <div class="w-9 h-9 rounded-full bg-blue-600 flex items-center justify-center text-white text-sm font-bold">
      {{ authStore.user()?.name?.charAt(0) || 'U' }}
    </div>
    <div>
      <p class="text-sm font-medium text-slate-900">{{ authStore.user()?.name || 'مستخدم' }}</p>
      <p class="text-xs text-slate-400">{{ authStore.user()?.role || '—' }}</p>
    </div>
  </div>

  <button
    (click)="authStore.logout()"
    class="flex items-center gap-2 px-4 py-2 text-sm text-red-600 hover:bg-red-50 rounded-lg transition-colors"
  >
    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
      <polyline points="16 17 21 12 16 7"/>
      <line x1="21" y1="12" x2="9" y2="12"/>
    </svg>
    <span>تسجيل الخروج</span>
  </button>
</header>
