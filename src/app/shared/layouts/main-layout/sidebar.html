<aside class="w-64 h-screen bg-slate-900 text-white flex flex-col shrink-0">
  <div class="h-16 flex items-center px-6 border-b border-slate-700">
    <span class="text-xl font-bold tracking-wide">نظام إدارة المدارس</span>
  </div>

  <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
    @for (item of filteredNav(); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-slate-700 text-white"
        class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-colors"
      >
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" [innerHTML]="item.svg"></svg>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="p-4 border-t border-slate-700 text-xs text-slate-500 text-center">
    v2026.1
  </div>
</aside>
