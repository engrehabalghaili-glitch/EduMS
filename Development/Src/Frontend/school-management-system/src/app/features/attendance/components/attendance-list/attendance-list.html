<div class="dashboard-inner-container">
  <div class="dashboard-header">
    <div>
      <div class="dashboard-title">إدارة الحضور والغياب</div>
      <div class="dashboard-subtitle">تسجيل ومتابعة حضور الطلاب اليومي</div>
    </div>
  </div>

  <div class="card surface-card shadow-2 border-round-xl p-4">
    <div class="filters-row">
      <div class="filter-item">
        <label for="classSelect">اختر الصف</label>
        <p-select
          id="classSelect"
          [options]="classOptions()"
          [(ngModel)]="selectedClassId"
          (ngModelChange)="onClassChange()"
          optionLabel="label"
          optionValue="value"
          placeholder="-- اختر الصف --"
          styleClass="w-full" />
      </div>
      <div class="filter-item">
        <label for="datePicker">اختر التاريخ</label>
        <p-datepicker
          id="datePicker"
          [(ngModel)]="selectedDate"
          (ngModelChange)="onDateChange()"
          dateFormat="dd/mm/yy"
          [showIcon]="true"
          styleClass="w-full" />
      </div>
    </div>
  </div>

  @if (selectedClassId()) {
    <div class="card surface-card shadow-2 border-round-xl p-4">
      <p-table [value]="attendanceRows()" dataKey="studentId" styleClass="p-datatable-sm">
        <ng-template pTemplate="caption">
          <div class="table-caption">
            <span class="caption-text">قائمة الطلاب - <strong>{{ selectedClassName() }}</strong></span>
            <span class="caption-date">{{ selectedDate() | date:'EEEE, d MMMM y' }}</span>
          </div>
        </ng-template>
        <ng-template pTemplate="header">
          <tr>
            <th style="width: 4rem">#</th>
            <th>اسم الطالب</th>
            <th style="width: 22rem">الحضور</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-row let-i="rowIndex">
          <tr>
            <td class="text-center font-bold">{{ i + 1 }}</td>
            <td><strong>{{ row.studentName }}</strong></td>
            <td>
              <p-selectButton
                [options]="attendanceOptions"
                [(ngModel)]="row.status"
                optionLabel="label"
                optionValue="value"
                [multiple]="false"
                styleClass="attendance-select" />
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="3" class="text-center">لا يوجد طلاب في هذا الصف</td>
          </tr>
        </ng-template>
      </p-table>

      <div class="save-section">
        <button
          pButton
          label="حفظ التحضير"
          icon="pi pi-save"
          class="p-button-primary btn-save"
          [disabled]="attendanceRows().length === 0"
          (click)="saveAttendance()">
        </button>
      </div>
    </div>
  }
</div>

<p-toast position="top-center" />
