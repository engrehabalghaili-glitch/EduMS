<div class="layout-wrapper">
  <aside class="layout-sidebar" [class.collapsed]="isCollapsed()" [style.width]="sidebarWidth()">
    <div class="sidebar-logo">
      <div class="logo-full">البوابة الطلابية</div>
      <div class="logo-mini">ط</div>
    </div>

    <nav class="sidebar-menu">
      @for (item of menuItems(); track item.route) {
        <a [routerLink]="item.route" routerLinkActive="active-route" class="menu-item" [pTooltip]="item.label" [tooltipDisabled]="!isCollapsed()" tooltipPosition="right">
          <i [class]="item.icon"></i>
          <span class="menu-label">{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <a class="menu-item logout-item" (click)="logout()" [pTooltip]="'تسجيل الخروج'" [tooltipDisabled]="!isCollapsed()" tooltipPosition="right">
        <i class="pi pi-sign-out"></i>
        <span class="menu-label">تسجيل الخروج</span>
      </a>
    </div>
  </aside>

  <div class="layout-main">
    <header class="layout-topbar">
      <div class="topbar-right">
        <button class="toggle-btn" [class.active]="isCollapsed()" (click)="toggleSidebar()">
          <i class="pi pi-bars toggle-icon"></i>
        </button>
        <span class="system-title">🏫 نظام إدارة المدرسة - بوابة الطالب</span>
      </div>
      <div class="topbar-left">
        <div class="user-profile">
          <div class="avatar-circle">{{ (currentUser()?.name || 'طالب')[0] }}</div>
          <div class="user-info">
            <span class="user-name">{{ currentUser()?.name || 'طالب' }}</span>
            <span class="user-role">{{ currentUser()?.roles?.join('، ') || 'مستخدم' }}</span>
          </div>
        </div>
      </div>
    </header>

    <main class="layout-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
