<div class="min-h-screen w-full flex items-center justify-center bg-surface-50 dark:bg-surface-900 p-4">
  <div class="w-full max-w-md">
    <!-- استخدام كرت PrimeNG كحاوية لنموذج الدخول -->
    <p-card styleClass="shadow-lg rounded-2xl overflow-hidden border border-surface-200 dark:border-surface-700">
      <ng-template pTemplate="header">
        <div class="bg-primary text-primary-contrast p-6 text-center">
          <i class="pi pi-shield text-5xl mb-3"></i>
          <h2 class="text-2xl font-bold m-0">نظام إدارة التعليم</h2>
          <p class="text-primary-contrast/80 mt-2 m-0 text-sm">تسجيل الدخول للمتابعة</p>
        </div>
      </ng-template>

      <!-- رسالة الخطأ إن وجدت -->
      <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm flex items-center gap-2 border border-red-200">
        <i class="pi pi-exclamation-circle"></i>
        <span>{{ errorMessage }}</span>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
        
        <!-- حقل اسم المستخدم -->
        <div class="flex flex-col gap-2">
          <label for="username" class="text-sm font-medium text-surface-700 dark:text-surface-100">اسم المستخدم</label>
          <div class="p-input-icon-left w-full">
            <i class="pi pi-user z-10 text-surface-500"></i>
            <input 
              pInputText 
              id="username" 
              type="text" 
              formControlName="username" 
              placeholder="أدخل اسم المستخدم"
              class="w-full pl-10"
              [ngClass]="{'ng-invalid ng-dirty': loginForm.get('username')?.invalid && loginForm.get('username')?.touched}"
            />
          </div>
          <small class="text-red-500" *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
            اسم المستخدم مطلوب
          </small>
        </div>

        <!-- حقل كلمة المرور -->
        <div class="flex flex-col gap-2">
          <label for="password" class="text-sm font-medium text-surface-700 dark:text-surface-100">كلمة المرور</label>
          <div class="w-full">
            <p-password 
              id="password" 
              formControlName="password" 
              [feedback]="false" 
              [toggleMask]="true"
              placeholder="أدخل كلمة المرور"
              styleClass="w-full"
              inputStyleClass="w-full"
              [ngClass]="{'ng-invalid ng-dirty': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}"
            ></p-password>
          </div>
          <small class="text-red-500" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            كلمة المرور مطلوبة ويجب ألا تقل عن 6 أحرف
          </small>
        </div>

        <!-- زر الدخول -->
        <div class="mt-4">
          <p-button 
            type="submit" 
            label="تسجيل الدخول" 
            icon="pi pi-sign-in" 
            styleClass="w-full p-3 font-bold text-lg rounded-xl"
            [loading]="isLoading"
          ></p-button>
        </div>

      </form>
    </p-card>

    <div class="text-center mt-6 text-surface-500 text-sm">
      <p>جميع الحقوق محفوظة &copy; EduMS 2026</p>
    </div>
  </div>
</div>
