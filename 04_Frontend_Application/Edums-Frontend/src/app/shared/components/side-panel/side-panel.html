<p-drawer
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [header]="header()"
  [position]="position()"
  [style]="{ width: width() }"
  [modal]="modal()"
  [closable]="closable()"
  [dismissible]="dismissible()"
  [closeOnEscape]="closeOnEscape()"
  [blockScroll]="blockScroll()"
  [styleClass]="styleClass()"
>
  @if (loading()) {
    <div class="panel-skeleton">
      @for (line of skeletonLines; track line) {
        <p-skeleton width="100%" height="1rem" [style]="{ 'margin-bottom': '0.75rem' }" />
      }
    </div>
  } @else {
    <ng-content />
  }
</p-drawer>
