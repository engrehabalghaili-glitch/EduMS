<div class="app-shell">

  <!-- SIDEBAR -->
  <aside class="sidebar" [class.collapsed]="sidebarCollapsed()">
    <div class="sidebar-brand">
      <div class="brand-logo">E</div>
      <div class="brand-text" *ngIf="!sidebarCollapsed()">
        <div class="brand-name">EduMS</div>
        <div class="brand-tagline">Enterprise Edition</div>
      </div>
    </div>

    <div class="sidebar-user" *ngIf="currentUser() as user">
      <div class="user-avatar">{{ user.name | slice:0:2 }}</div>
      <div class="user-info" *ngIf="!sidebarCollapsed()">
        <div class="user-name">{{ user.name }}</div>
        <div class="user-role">{{ user.roles[0] }}</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <ng-container *ngFor="let item of menuItems()">
        <div *ngIf="item.type === 'section'" class="sidebar-section-title">
          {{ item.label }}
        </div>
        <a *ngIf="item.type !== 'section'"
           [routerLink]="item.route"
           routerLinkActive="active"
           class="nav-item">
          <i class="ph {{ item.icon }} nav-icon"></i>
          <span class="nav-text">{{ item.label }}</span>
          <span class="nav-badge" *ngIf="item.badge">{{ item.badge }}</span>
        </a>
      </ng-container>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main-content">
    <header class="topbar">
      <button class="topbar-toggle" (click)="toggleSidebar()">
        <i class="ph ph-list"></i>
      </button>

      <div class="topbar-search">
        <input type="text" class="form-control" placeholder="🔍 بحث سريع...">
      </div>

      <div class="topbar-actions">
        <button class="topbar-action-btn" *hasPermission="['*']">
          <i class="ph ph-bell"></i>
          <span class="notif-dot"></span>
        </button>
        <button class="topbar-action-btn" (click)="logout()">
          <i class="ph ph-sign-out"></i>
        </button>
      </div>
    </header>

    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
