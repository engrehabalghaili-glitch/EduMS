<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduMS - تعديل بيانات مستخدم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1>🏛️ EduMS</h1>
                <p>نظام إدارة المدارس</p>
            </div>
            
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">الأمن والصلاحيات</div>
                    <a href="users.html" class="nav-item">
                        <span class="icon">⬅️</span>
                        <span>العودة للقائمة</span>
                    </a>
                </div>
            </nav>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Header -->
            <header class="top-header">
                <div class="header-left">
                    <h2>الأمن والصلاحيات - تعديل مستخدم</h2>
                </div>
                <div class="header-right">
                    <div class="user-profile">
                        <div class="user-avatar">م</div>
                        <div class="user-info">
                            <h4>مدير النظام</h4>
                            <p>الإدارة العليا</p>
                        </div>
                    </div>
                </div>
            </header>
            
            <!-- Content Area -->
            <div class="content-area">
                <!-- Page Header -->
                <div class="page-header">
                    <h1 class="page-title">⚙️ تعديل بيانات المستخدم: مدير المدرسة</h1>
                </div>
                
                <!-- Edit Form -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">إعدادات الحساب والصلاحيات</h3>
                    </div>
                    <div class="card-body" style="padding: 30px;">
                        <form>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">الاسم الكامل</label>
                                    <input type="text" class="form-input" value="مدير المدرسة">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">اسم المستخدم</label>
                                    <input type="text" class="form-input" value="admin_school" disabled>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">البريد الإلكتروني</label>
                                    <input type="email" class="form-input" value="admin@school.edu">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">رقم الجوال</label>
                                    <input type="tel" class="form-input" value="0550001112">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">الدور (Role)</label>
                                    <select class="form-select">
                                        <option selected>مدير النظام</option>
                                        <option>مشرف أكاديمي</option>
                                        <option>محاسب</option>
                                        <option>معلم</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">حالة الحساب</label>
                                    <select class="form-select">
                                        <option selected>نشط</option>
                                        <option>معطل</option>
                                        <option>مغلق مؤقتاً</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div style="margin-top: 30px; padding: 20px; background: #fff7ed; border-radius: 8px; border: 1px solid #ffedd5;">
                                <h4 style="color: #9a3412; margin-bottom: 10px;">🔐 تغيير كلمة المرور</h4>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label class="form-label">كلمة المرور الجديدة</label>
                                        <input type="password" class="form-input" placeholder="********">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">تأكيد كلمة المرور</label>
                                        <input type="password" class="form-input" placeholder="********">
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer" style="padding: 20px 30px; border-top: 1px solid #e5e7eb; display: flex; justify-content: flex-end; gap: 10px;">
                        <button class="btn btn-outline">إلغاء</button>
                        <button class="btn btn-primary">حفظ التعديلات</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
