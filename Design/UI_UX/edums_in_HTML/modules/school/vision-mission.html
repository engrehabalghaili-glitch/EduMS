<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduMS - الرؤية والرسالة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar will be here via JS or included -->
        <main class="main-content">
            <header class="top-header">
                <h2>إدارة المدرسة - الرؤية والرسالة والاهداف</h2>
            </header>
            <div class="content-area">
                <div class="card">
                    <div class="card-header"><h3 class="card-title">الرؤية والرسالة</h3></div>
                    <div class="card-body" style="padding: 30px;">
                        <div class="form-group">
                            <label class="form-label">رؤية المدرسة</label>
                            <textarea class="form-textarea" rows="4">نطمح لتوفير بيئة تعليمية رائدة تخرج أجيالاً مبدعة ومؤهلة للمستقبل.</textarea>
                        </div>
                        <div class="form-group">
                            <label class="form-label">رسالة المدرسة</label>
                            <textarea class="form-textarea" rows="4">تقديم تعليم عالي الجودة يجمع بين القيم والأصالة والابتكار التقني.</textarea>
                        </div>
                        <div class="form-group">
                            <label class="form-label">الأهداف الاستراتيجية</label>
                            <textarea class="form-textarea" rows="6">1. تحسين التحصيل العلمي.
2. تطوير المهارات الرقمية.
3. تعزيز القيم الوطنية.</textarea>
                        </div>
                        <button class="btn btn-primary">حفظ التغييرات</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
