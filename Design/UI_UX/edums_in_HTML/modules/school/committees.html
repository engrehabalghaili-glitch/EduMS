<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduMS - اللجان وفرق العمل</title>
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
    <div class="app-container">
        <main class="main-content">
            <header class="top-header"><h2>اللجان وفرق العمل</h2></header>
            <div class="content-area">
                <div class="card">
                    <div class="card-header"><h3 class="card-title">قائمة اللجان المدرسية</h3></div>
                    <div class="card-body">
                        <table class="data-table">
                            <thead>
                                <tr><th>اسم اللجنة</th><th>رئيس اللجنة</th><th>عدد الأعضاء</th><th>الحالة</th><th>إجراءات</th></tr>
                            </thead>
                            <tbody>
                                <tr><td>لجنة التوجيه والإرشاد</td><td>أحمد السعيد</td><td>5</td><td>نشطة</td><td><button class="btn btn-sm">عرض</button></td></tr>
                                <tr><td>لجنة الأمن والسلامة</td><td>خالد الحربي</td><td>4</td><td>نشطة</td><td><button class="btn btn-sm">عرض</button></td></tr>
                            </tbody>
                        </table>
                        <button class="btn btn-primary" style="margin-top: 20px;">إضافة لجنة جديدة</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
